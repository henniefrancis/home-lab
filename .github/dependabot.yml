---
# Weekly and grouped (one PR per ecosystem) to conserve CI minutes while the repo is private.
#
# Ecosystems whose manifests do not exist yet are NOT listed (dependabot errors on a directory with no
# matching manifest). Add each in the milestone that introduces it, using the same shape as below:
#   (M1 terraform is listed below.)
#   M3 (added below): docker-compose /traefik and /tailscale (M4 adds /authentik; /homepage arrives in M5); docker /traefik/ra-helper
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/edge
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]

  # M3. Image bumps for Traefik, the socket proxy, whoami and Tailscale arrive as one weekly PR. The pinned
  # aws_signing_helper release in traefik/ra-helper/Dockerfile and scripts/lib/pins.sh is NOT tracked here; bump it by hand
  # from the AWS user guide (CI fails if the two files disagree).
  - package-ecosystem: docker-compose
    directories:
      - /traefik
      - /tailscale
      - /authentik
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
    # PostgreSQL stays on 16 (the major Authentik documents and tests); a major upgrade is a planned dump/restore, not a bot PR.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /traefik/ra-helper
    schedule:
      interval: weekly
    groups:
      ra-helper-base:
        patterns: ["*"]
