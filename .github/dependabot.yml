---
# Weekly and grouped (one PR per ecosystem) to conserve CI minutes while the repo is private.
#
# Ecosystems whose manifests do not exist yet are NOT listed (dependabot errors on a directory with no matching manifest).
# Add each in the milestone that introduces it, using the same shape as below.
#
# N10 (supply chain): every entry has a cooldown, so a brand-new upstream release is not proposed for a few days (a poisoned
# release is usually pulled or flagged within that time). Cooldown applies to version updates only; Dependabot SECURITY updates
# are not delayed.
#
# Merging Dependabot PRs: GitHub signs web-merge, squash and bot commits with its own key, which the Pi does not trust. Never
# deploy a GitHub-created commit directly. Flow: docs/runbooks/release-and-deploy.md ("Dependabot and GitHub-made commits").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/edge
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      terraform:
        patterns: ["*"]

  # Image bumps for Traefik, Authentik, PostgreSQL, Tailscale, Homepage, IT Tools, Pi-hole, Linkwarden, Netdata, Portainer and
  # Home Assistant arrive as one weekly PR; every reference is tag@sha256 and Dependabot rewrites tag and digest together.
  # The pinned aws_signing_helper release in traefik/ra-helper/Dockerfile and scripts/lib/pins.sh is NOT tracked here; bump it by
  # hand from the AWS user guide (CI fails if the two files disagree).
  # QA-M-2: home-lab/ra-helper is built locally from /traefik/ra-helper and does not exist in any registry. Dependabot tried to
  # resolve it, got UNAUTHORIZED and failed the whole docker_compose job, so no image PR was ever opened. It is ignored here.
  - package-ecosystem: docker-compose
    directories:
      - /traefik
      - /tailscale
      - /authentik
      - /homepage
      - /it-tools
      - /pihole
      - /linkwarden
      - /netdata
      - /portainer
      - /homeassistant
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      - dependency-name: home-lab/ra-helper
      # home-lab/it-tools is built locally from /it-tools (its two FROM digests are tracked by the docker entry below).
      - dependency-name: home-lab/it-tools
      # PostgreSQL stays on 16 (the major Authentik documents and tests); a major upgrade is a planned dump/restore, not a bot PR.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # Meilisearch stays on the line Linkwarden pins (v1.13 for Linkwarden v2.16): a newer Meilisearch cannot open the old index without
      # a dump and import. Bump it together with Linkwarden, by hand, from Linkwarden's own docker-compose.yml.
      - dependency-name: getmeili/meilisearch
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /traefik/ra-helper
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      ra-helper-base:
        patterns: ["*"]

  # IT Tools (M7): the official static build and the NGINX unprivileged base, both FROM lines pinned by digest.
  - package-ecosystem: docker
    directory: /it-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      it-tools-images:
        patterns: ["*"]
    ignore:
      # R19: stay on nginx's even-numbered stable line (1.30.x). 1.31 is the mainline branch and 1.30.6 already carries the same security
      # fixes. Patch bumps still arrive; move to the next even line (1.32, normally in April) by hand, with a signed commit.
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: ["version-update:semver-minor"]

  # N2: the images CI runs with `docker run` (gitleaks, terraform, tflint, trivy) each have their own one-line Dockerfile under
  # ci/images/<tool>/ (see the header there), so a registry problem fails only that tool's job.
  # They live OUTSIDE .github on purpose: under /.github/ci-images Dependabot found the tflint bump but GitHub refused the PR
  # ("invalid or unauthorized changes", dependency_file_not_supported, 2026-11-09).
  # /ci/images/terraform is NOT listed: Docker Hub answers Dependabot's lookup of hashicorp/terraform with UNAUTHORIZED, which
  # fails the whole job. Bump that image by hand together with required_version in terraform/*/versions.tf (same Terraform
  # release), digest from the official Docker Hub tag page.
  - package-ecosystem: docker
    directories:
      - /ci/images/gitleaks
      - /ci/images/tflint
      - /ci/images/trivy
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      ci-images:
        patterns: ["*"]

  # CI Python tooling (yamllint), ci/requirements-ci.txt (moved out of .github for the same reason as the images).
  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      ci-python:
        patterns: ["*"]

  # The pre-commit hook revisions in .pre-commit-config.yaml.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      pre-commit-hooks:
        patterns: ["*"]
