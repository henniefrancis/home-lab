---
# Secret scan on EVERY push and pull request, with no path filter (SEC-M6). The main workflow skips Markdown-only changes to save
# minutes, but Markdown is exactly where runbook authors paste real output, so this one never skips. It is tiny (seconds).
# Branch protection / the ruleset should require the check `secret-scan` as well as `checks`.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks (full history, then the working tree)
        run: |
          set -eu
          img="$(awk '$1=="FROM" && $4=="gitleaks" {print $2}' ci/images/gitleaks/Dockerfile)"
          [ -n "$img" ] || { echo "no gitleaks image in ci/images/gitleaks/Dockerfile"; exit 1; }
          docker run --rm -v "$PWD:/repo" "$img" git /repo --config /repo/.gitleaks.toml --redact --no-banner
          docker run --rm -v "$PWD:/repo" "$img" dir /repo --config /repo/.gitleaks.toml --redact --no-banner

      - name: Self-test - the custom rules catch account and zone IDs and ignore the placeholders; the private denylist script fails closed (N12)
        run: bash scripts/test-gitleaks-rules.sh
