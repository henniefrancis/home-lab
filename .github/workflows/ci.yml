---
# One lean job (target < 5 minutes) to stay inside the 100 minutes/month cap while the repo is private.
# No credentials, no HCP token, no cloud access: Terraform checks use `init -backend=false` only.
# Markdown-only changes skip this workflow, NOT the secret scan: that runs in .github/workflows/secret-scan.yml on every push
# and pull request (SEC-M6). Third-party tool images come pinned by digest from ci/images/<tool>/Dockerfile (SEC-M5).
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard - no tracked tfvars other than examples
        run: |
          set -eu
          bad="$(git ls-files | grep -E '\.(auto\.)?tfvars$' || true)"
          if [ -n "$bad" ]; then
            echo "Tracked tfvars files are not allowed (use *.tfvars.example):"
            echo "$bad"
            exit 1
          fi

      - name: Guard - banned Terraform resource aws_route53domains_domain
        run: |
          set -eu
          # That resource can register, renew and deregister domains. Use aws_route53domains_registered_domain.
          # Only resource/data declarations in Terraform files match, so comments, docs and the README may name it.
          if git grep -nE '(resource|data)[[:space:]]+"aws_route53domains_domain"|"aws_route53domains_domain"[[:space:]]*:' -- '*.tf' '*.tf.json'; then
            echo "aws_route53domains_domain is banned in this repo."
            exit 1
          fi

      - name: Guard - SecureStrings are not Terraform-managed, public-safe config
        run: |
          set -eu
          # ADR-013: the six SecureStrings are owner-managed (scripts/set-secret.sh). No Terraform resource may create or read one:
          # the provider reads a SecureString WithDecryption, and the home-lab key denies Decrypt to the HCP roles.
          re='value_wo|aws_ssm_parameter"[[:space:]]+"secret"|data[[:space:]]+"aws_ssm_parameter"'
          if git grep -nE "$re" -- 'terraform/*.tf' 'terraform/**/*.tf' | grep -v ':[0-9]*:[[:space:]]*#'; then
            echo "No value_wo, secret SSM resource or SSM data source in terraform/ (ADR-013)."; exit 1
          fi
          if git grep -nE '^[[:space:]]*type[[:space:]]*=[[:space:]]*"SecureString"' -- terraform; then
            echo "No aws_ssm_parameter of type SecureString may exist in terraform/."; exit 1
          fi
          # config/ is public: no domain assignment, no ARNs, no 12-digit account IDs.
          if [ -d config ] && grep -rnE '(^|[^A-Z_])DOMAIN=|arn:aws:|(^|[^0-9])[0-9]{12}([^0-9]|$)' config; then
            echo "config/ must stay free of DOMAIN=, ARNs and account IDs."; exit 1
          fi

      - name: Guard - no workflow ever grants id-token write or uses AWS credentials (N1)
        run: |
          set -eu
          # home-lab has no AWS OIDC role. The IAM role EC2SSM in ANOTHER stack trusts every repo of the owner's GitHub account
          # (repo:<owner>/*), so a home-lab workflow that could mint a GitHub OIDC token must never exist (N1). id-token write is
          # also implied by `permissions: write-all`. Comments are ignored.
          # the [x] character classes keep this file from matching itself
          re='id-toke[n][[:space:]]*:[[:space:]]*writ[e]|permission[s][[:space:]]*:[[:space:]]*write-al[l]'
          re="$re|aws-action[s]/|role-to-assum[e]|configure-aws-credential[s]"
          if git grep -nEi "$re" -- .github/workflows | grep -Ev '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo "A workflow asks for the OIDC token permission, write-all, or AWS credentials. home-lab must not be able to mint an AWS OIDC token (N1)."
            exit 1
          fi
          # every workflow and job must declare permissions (a missing block means the repository default, which may be write)
          for f in .github/workflows/*.yml; do
            grep -qE '^permissions:' "$f" || { echo "$f has no top-level permissions block"; exit 1; }
          done

      - name: Guard - executable bits (every script except scripts/lib/* is 100755)
        run: |
          set -eu
          # The Pi runs these as `sudo scripts/<name>.sh`; a 100644 script fails there with "command not found" (it did, breakglass.sh).
          bad="$(git ls-files -s -- 'scripts/*.sh' | awk '$1 != "100755" {print $4 " is mode " $1}' | grep -v '^scripts/lib/' || true)"
          if [ -n "$bad" ]; then
            echo "These scripts are not executable in git (fix: git update-index --chmod=+x <file>):"
            echo "$bad"
            exit 1
          fi
          # and the sourced helpers must NOT be executable (they are libraries)
          lib="$(git ls-files -s -- 'scripts/lib/*.sh' | awk '$1 != "100644" {print $4 " is mode " $1}')"
          if [ -n "$lib" ]; then echo "$lib"; echo "scripts/lib/*.sh are libraries and stay 100644."; exit 1; fi

      - name: Set up Python (pip cache)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ci/requirements-ci.txt

      - name: yamllint
        run: |
          pip install --quiet -r ci/requirements-ci.txt
          yamllint --strict .

      - name: shellcheck
        run: |
          set -eu
          files="$(git ls-files '*.sh')"
          if [ -n "$files" ]; then
            # (the shellcheck binary ships on ubuntu-latest runners)
            echo "$files" | xargs shellcheck -x
          else
            echo "No shell scripts yet."
          fi

      - name: Self-test - existing_records generator
        run: bash scripts/test-inventory.sh

      - name: Self-test - PKI scripts (offline CA, CSR, sign, install)
        run: bash scripts/pki/test-pki.sh

      - name: Self-test - fetch-secrets.sh with a mock aws (runs as root on the runner, temp dirs only; a non-root skip is a failure)
        run: |
          set -eu
          [ "$(sudo id -u)" = 0 ] || { echo "sudo does not give root"; exit 1; }
          sudo -E env REQUIRE_ROOT=1 bash scripts/test-fetch-secrets.sh

      - name: Self-test - set-secret.sh with a mock aws (the mock is proven before use)
        run: bash scripts/test-set-secret.sh

      - name: Self-test - ops scripts (deploy args, signed-deploy check, cert expiry, break-glass, preflight args, pki)
        run: bash scripts/test-ops-scripts.sh

      - name: Self-test - alert path (served-cert-check.sh against a local TLS server, alert.sh with a mock aws, rate limit; the mock is proven before use)
        run: bash scripts/test-alert.sh

      - name: Self-test - aws-preflight.sh --snapshot against a mock aws (CRLF, empty duplicate list, TXT quotes; the mock is proven before use)
        run: bash scripts/test-aws-preflight.sh

      - name: Self-test - deploy.sh as root with real git (signed, unsigned, wrong key, rollback, root-owned checkout, hooks, signers owner)
        run: |
          set -eu
          [ "$(sudo id -u)" = 0 ] || { echo "sudo does not give root"; exit 1; }
          sudo -E env REQUIRE_ROOT=1 bash scripts/test-deploy.sh

      - name: Guard - identity stays out of the HCP stack (SEC-H1, SEC-M1)
        run: |
          set -eu
          # terraform/edge must hold no IAM or Roles Anywhere resource (only the removed blocks that forget the old state).
          if git grep -nE '^(resource|data)[[:space:]]+"(aws_iam_(role|policy|user|group)|aws_rolesanywhere_[a-z_]+)"' -- terraform/edge; then
            echo "terraform/edge must not define IAM or Roles Anywhere resources: they live in terraform/bootstrap."; exit 1
          fi
          # The apply role must not be able to rewrite a role: none of these exact actions may appear in roles.tf.
          iam_re='"iam:(CreateRole|PutRolePolicy|UpdateAssumeRolePolicy|AttachRolePolicy|DeleteRolePolicy)"'
          ra_re='"rolesanywhere:(CreateTrustAnchor|CreateProfile|UpdateProfile|UpdateTrustAnchor)"'
          if git grep -nE "$iam_re|$ra_re" -- terraform/bootstrap/roles.tf; then
            echo "roles.tf must not grant identity-changing actions to the HCP roles."; exit 1
          fi
          # The apply role's Route 53 write actions are scoped to the zone, never to every hosted zone.
          if git grep -nF 'hostedzone/*' -- terraform/bootstrap/roles.tf; then
            echo "roles.tf must not use hostedzone/* (scope it to the home-lab zone)."; exit 1
          fi

      - name: Guard - no Docker socket, no Docker provider, images pinned by digest (SEC-H2, SEC-M5)
        run: |
          set -eu
          sock_re='docker[.]sock|providers[.]docker|docker-socket-proxy|tecnativa'
          if git grep -nE "$sock_re" -- traefik authentik homepage tailscale compose.yaml | grep -v ':[0-9]*:[[:space:]]*#'; then
            echo "No Docker socket or Docker provider anywhere in the stacks."; exit 1
          fi
          files='traefik/compose.yaml authentik/compose.yaml homepage/compose.yaml tailscale/compose.yaml'
          # shellcheck disable=SC2086
          bad="$(git grep -hE '^[[:space:]]+image:[[:space:]]' -- $files | grep -v 'home-lab/ra-helper' | grep -Ev '@sha256:[0-9a-f]{64}' || true)"
          if [ -n "$bad" ]; then echo "Images must be pinned tag@sha256:"; echo "$bad"; exit 1; fi

      - name: Guard - ra-helper version and checksum match scripts/lib/pins.sh, and its build has no mutable input (N8)
        run: |
          set -eu
          . scripts/lib/pins.sh
          grep -qx "ARG HELPER_VERSION=${HELPER_VERSION}" traefik/ra-helper/Dockerfile || { echo "Dockerfile HELPER_VERSION differs from pins.sh"; exit 1; }
          grep -qx "ARG HELPER_SHA256=${HELPER_SHA256}" traefik/ra-helper/Dockerfile || { echo "Dockerfile HELPER_SHA256 differs from pins.sh"; exit 1; }
          grep -q "image: home-lab/ra-helper:${HELPER_VERSION}\$" traefik/compose.yaml ||
            { echo "traefik/compose.yaml ra-helper tag differs from pins.sh"; exit 1; }
          # N8: every FROM is pinned by digest and nothing is installed from a package mirror at build time.
          bad="$(grep -E "^FROM " traefik/ra-helper/Dockerfile | grep -Ev "@sha256:[0-9a-f]{64}" || true)"
          if [ -n "$bad" ]; then echo "ra-helper FROM lines must be pinned by digest:"; echo "$bad"; exit 1; fi
          if grep -nE "(apt|apt-get|apk|pip|npm|curl|wget)[[:space:]]" traefik/ra-helper/Dockerfile | grep -v "^[0-9]*:#"; then
            echo "ra-helper must not install packages or download anything except the checksummed ADD (N8)."; exit 1
          fi

      - name: docker compose config - root project (dummy env, no secrets)
        run: |
          set -eu
          d="$(mktemp -d)"
          mkdir -p "$d/secrets/tailscale" "$d/secrets/authentik"
          : > "$d/secrets/tailscale/tailscale.env"
          {
            echo "APPS_ROOT=$d"
            echo "DOMAIN=lab.example.test"
            echo "ROUTE53_ZONE_ID=Z0000000000000000000"
            echo "RA_TRUST_ANCHOR_ARN=dummy-trust-anchor"
            echo "RA_ACME_PROFILE_ARN=dummy-profile"
            echo "RA_ACME_ROLE_ARN=dummy-role"
          } > "$d/ci.env"
          docker compose --env-file config/lab.env --env-file "$d/ci.env" config -q

      - name: Self-test - Traefik stack (flags, dynamic files, redirect, TLS options, hardening; dummy values, no ACME)
        run: bash scripts/test-traefik-config.sh

      - name: Self-test - Authentik stack definition (static checks without containers - pinned images, hardening, file secrets, service ids, blueprint, labels)
        run: bash scripts/test-authentik-config.sh --static

      - name: Self-test - Homepage stack definition (static checks, no containers)
        run: bash scripts/test-homepage-config.sh --static

      - name: Terraform fmt and validate (no backend, no credentials)
        run: |
          set -eu
          img="$(awk '$1=="FROM" && $4=="terraform" {print $2}' ci/images/terraform/Dockerfile)"
          tf() { docker run --rm -v "$PWD:/w" -w "/w/$1" "$img" "${@:2}"; }
          docker run --rm -v "$PWD:/w" -w /w "$img" fmt -check -recursive -diff
          for d in bootstrap edge; do
            tf "terraform/$d" init -backend=false -input=false -no-color > /dev/null
            tf "terraform/$d" validate -no-color
          done

      - name: Self-test - bootstrap IAM and KMS policies (terraform test; stub provider, dead proxy, nothing reaches AWS)
        run: |
          set -eu
          IMG="$(awk '$1=="FROM" && $4=="terraform" {print $2}' ci/images/terraform/Dockerfile)"
          export IMG
          cat > "$RUNNER_TEMP/tf" << 'WRAP'
          #!/bin/sh
          e=""
          for v in HTTPS_PROXY HTTP_PROXY NO_PROXY TF_IN_AUTOMATION TF_INPUT AWS_CONFIG_FILE AWS_SHARED_CREDENTIALS_FILE AWS_EC2_METADATA_DISABLED; do
            e="$e -e $v"
          done
          # Run as the runner's uid so the providers terraform downloads into the temp dir stay deletable (as root they were not).
          # shellcheck disable=SC2086
          exec docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:$PWD" -w "$PWD" $e "$IMG" "$@"
          WRAP
          chmod +x "$RUNNER_TEMP/tf"
          TERRAFORM="$RUNNER_TEMP/tf" bash scripts/test-terraform-policies.sh

      # `tflint --init` downloads the aws ruleset from the GitHub API. Unauthenticated, that shares the runner IP's 60 requests/hour
      # and failed CI with 403 rate limit (2026-11-09). The job token (contents: read, expires with the job) lifts that limit; it is
      # passed by name only, never echoed, into an image pinned by digest.
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          img="$(awk '$1=="FROM" && $4=="tflint" {print $2}' ci/images/tflint/Dockerfile)"
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/data" -w /data --entrypoint sh "$img" -c '
            tflint --init --config=/data/.tflint.hcl > /dev/null
            for d in bootstrap edge; do
              tflint --chdir="terraform/$d" --config=/data/.tflint.hcl
            done'

      - name: trivy config
        run: |
          img="$(awk '$1=="FROM" && $4=="trivy" {print $2}' ci/images/trivy/Dockerfile)"
          docker run --rm -v "$PWD:/w" -w /w "$img" \
            config --exit-code 1 --severity HIGH,CRITICAL --skip-dirs '**/.terraform' terraform
