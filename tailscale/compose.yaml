---
# Tailscale node for the Pi (plan 6.5). Host networking so the Pi itself is reachable on its tailnet IP and Traefik can
# bind to it. No subnet router, no exit node, no DNS changes. Joins as tag:homelab with a one-off auth key that
# scripts/fetch-secrets.sh writes to ${APPS_ROOT}/secrets/tailscale/tailscale.env as TS_AUTHKEY=... (from SSM
# /home-lab/tailscale/auth-key). After the node has joined, set that parameter back to UNSET: TS_AUTH_ONCE=true keeps
# the node logged in from the persisted state without a key.
#
# Start:  sudo scripts/deploy.sh --only tailscale
# Needs:  ${APPS_ROOT} and ${TS_HOSTNAME} from config/lab.env; docs/runbooks/m2-pi-setup.md
services:
  tailscale:
    image: tailscale/tailscale:v1.104.4
    container_name: tailscale
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "false"
      TS_EXTRA_ARGS: --advertise-tags=tag:homelab
      # F01: the image's iptables tried to modprobe ip_tables inside the container, which has no /lib/modules, so
      # every start logged "iptables ... ts-input ... modprobe: can't change directory to '/lib/modules'". nftables mode
      # (documented at https://tailscale.com/docs/features/firewall-mode) programs the firewall through netlink and
      # never calls iptables or modprobe; the host kernel loads nf_tables itself. No new capability and no mount.
      TS_DEBUG_FIREWALL_MODE: nftables
      TS_HOSTNAME: ${TS_HOSTNAME:?set TS_HOSTNAME in config/lab.env}
    env_file:
      - ${APPS_ROOT:?set APPS_ROOT in config/lab.env}/secrets/tailscale/tailscale.env
    volumes:
      - ${APPS_ROOT}/tailscale/state:/var/lib/tailscale
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
