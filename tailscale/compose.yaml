---
# Tailscale node for the Pi (plan 6.5). Host networking so the Pi itself is reachable on its tailnet IP and Traefik can
# bind to it. No subnet router, no exit node, no DNS changes. Joins as tag:homelab with a one-off auth key that
# scripts/fetch-secrets.sh writes to ${APPS_ROOT}/secrets/tailscale/tailscale.env as TS_AUTHKEY=... (from SSM
# /home-lab/tailscale/auth-key). After the node has joined, set that parameter back to UNSET: TS_AUTH_ONCE=true keeps
# the node logged in from the persisted state without a key.
#
# Start:  sudo scripts/deploy.sh --only tailscale
# Needs:  ${APPS_ROOT} and ${TS_HOSTNAME} from config/lab.env; docs/runbooks/m2-pi-setup.md
services:
  tailscale:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: tailscale
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/net/tun:/dev/net/tun
    # SEC-M4: host network namespace, so every capability matters. Everything is dropped except NET_ADMIN (routes, nftables,
    # tun). NET_RAW is NOT added: the Tailscale container docs list only NET_ADMIN (plus /dev/net/tun) for kernel mode, and
    # nftables mode (TS_DEBUG_FIREWALL_MODE below) programs the firewall over netlink, which needs no raw socket. Verified on
    # v1.104.4 with this exact profile: the node starts and reaches NeedsLogin. The one visible effect is that at start tailscaled
    # tries to clear LEGACY iptables rules, which needs a raw socket: on a host whose iptables is the legacy backend it logs
    # "linuxfw: clear iptables ... Permission denied" lines and carries on; on Raspberry Pi OS (iptables-nft) there is nothing to
    # clear. Do not add NET_RAW to silence them. https://tailscale.com/docs/features/containers/docker
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    # /run is needed because tailscaled first clears legacy iptables rules (it takes /run/xtables.lock) even in nftables mode.
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "false"
      # --snat-subnet-routes=false is REQUIRED for Traefik's lan-allowlist: by default Tailscale masquerades traffic that
      # is forwarded from tailscale0 into a local network (the published ports reach Traefik through the Docker bridge),
      # so Traefik saw every tailnet client as the proxy-network gateway (172.30.0.1) and answered 403. With SNAT off the
      # real 100.x source address arrives. TS_EXTRA_ARGS goes to `tailscale up`, which TS_AUTH_ONCE=true skips for a node
      # that is already logged in; the preference itself is stored in the persisted state (/apps/tailscale/state), and
      # a freshly built node picks it up from here. Check with: tailscale debug prefs | grep NoSNAT
      TS_EXTRA_ARGS: --advertise-tags=tag:homelab --snat-subnet-routes=false
      # F01: the image's iptables tried to modprobe ip_tables inside the container, which has no /lib/modules, so
      # every start logged "iptables ... ts-input ... modprobe: can't change directory to '/lib/modules'". nftables mode
      # (documented at https://tailscale.com/docs/features/firewall-mode) programs the firewall through netlink and
      # never calls iptables or modprobe; the host kernel loads nf_tables itself. No new capability and no mount.
      TS_DEBUG_FIREWALL_MODE: nftables
      TS_HOSTNAME: ${TS_HOSTNAME:?set TS_HOSTNAME in config/lab.env}
    env_file:
      - ${APPS_ROOT:?set APPS_ROOT in config/lab.env}/secrets/tailscale/tailscale.env
    volumes:
      - ${APPS_ROOT}/tailscale/state:/var/lib/tailscale
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
