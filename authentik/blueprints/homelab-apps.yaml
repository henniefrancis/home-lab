---
# Authentik blueprint for the home lab (plan 6.4, milestone M4): everything below is configuration as code.
# Mounted read-only at /blueprints/custom in the worker (and server); Authentik discovers it at start and re-applies it when
# the file changes (and periodically). Apply status: Admin interface -> Customization -> Blueprints -> "Home lab ...".
#
# What it does
#   1. MFA is ENFORCED for every login: the stock authentication flow's validation stage is changed from "skip when no device"
#      to "configure" (TOTP or WebAuthn; the user is walked through enrolment in the same login) and "deny" is not an option
#      for a user without a device. The stock flow is patched rather than replaced on purpose: a second, unpatched flow
#      (default-authentication-flow) would remain reachable at /if/flow/default-authentication-flow/ and bypass MFA.
#   2. Group homelab-admins (created once, akadmin is its first member; later membership is managed in the UI, this file
#      never overwrites it). Every application below is bound to that group, so it is fail-closed: a user who is not in the
#      group is denied even with a valid password and MFA.
#   3. One forward_single proxy provider + application per protected host: traefik.${DOMAIN} (Traefik dashboard),
#      dashboard.${DOMAIN} (Homepage, milestone M5), tools.${DOMAIN} (IT Tools, M7) and pihole.${DOMAIN} (Pi-hole, M8). forward_single => each app gets its OWN
#      host-only session cookie; there is no cookie_domain, so no cookie is ever shared across *.${DOMAIN}.
#   4. The embedded outpost (inside authentik-server) serves every provider. No separate outpost container, no docker.sock.
#
# ${DOMAIN} comes from the DOMAIN environment variable that compose sets on the worker (runtime.env); nothing identifying
# is committed. Adding a forward-auth app: copy a provider + application + binding triple, add the provider to the outpost
# list, and add the <app> and <app>-outpost routers plus a service to traefik/dynamic/routers.yml (pattern at the top there).
version: 1
metadata:
  name: Home lab - SSO apps, MFA and embedded outpost
  labels:
    blueprints.goauthentik.io/description: Forward-auth providers and applications, MFA enforcement and the embedded outpost for the home lab.
context: {}
entries:
  # --- Order: these stock blueprints must have been applied first (flows, stages, akadmin) -------------------------------
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - TOTP MFA setup flow
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - WebAuthn MFA setup flow
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: authentik Bootstrap

  # --- 1. MFA enforced ------------------------------------------------------------------------------------------------
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa-validation
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      not_configured_action: configure
      device_classes:
        - totp
        - webauthn
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
      webauthn_user_verification: preferred

  # --- 2. Admin group (membership is only seeded) -----------------------------------------------------------------------
  - model: authentik_core.group
    id: group-admins
    state: created
    identifiers:
      name: homelab-admins
    attrs:
      is_superuser: false
      users:
        - !If
          - !Find [authentik_core.user, [username, akadmin]]
          - !Find [authentik_core.user, [username, akadmin]]
          - []

  # Household group (M9): people who may use the household apps (Linkwarden) but not the admin tools. Created empty, once; the owner
  # adds members in the UI (Directory, Groups) and this file never changes the membership.
  - model: authentik_core.group
    id: group-users
    state: created
    identifiers:
      name: homelab-users
    attrs:
      is_superuser: false

  # --- 3. Providers and applications -----------------------------------------------------------------------------------
  - model: authentik_providers_proxy.proxyprovider
    id: provider-traefik
    identifiers:
      name: homelab-traefik
    attrs:
      mode: forward_single
      external_host: !Format ["https://traefik.%s", !Env DOMAIN]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=12
  - model: authentik_core.application
    id: app-traefik
    identifiers:
      slug: traefik
    attrs:
      name: Traefik dashboard
      provider: !KeyOf provider-traefik
      policy_engine_mode: any
      meta_launch_url: !Format ["https://traefik.%s/", !Env DOMAIN]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-traefik
      group: !KeyOf group-admins
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: provider-dashboard
    identifiers:
      name: homelab-dashboard
    attrs:
      mode: forward_single
      external_host: !Format ["https://dashboard.%s", !Env DOMAIN]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=12
  - model: authentik_core.application
    id: app-dashboard
    identifiers:
      slug: dashboard
    attrs:
      name: Home lab dashboard (Homepage)
      provider: !KeyOf provider-dashboard
      policy_engine_mode: any
      meta_launch_url: !Format ["https://dashboard.%s/", !Env DOMAIN]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-dashboard
      group: !KeyOf group-admins
      order: 0

  # IT Tools (M7, R17): same forward-auth pattern as the dashboard.
  - model: authentik_providers_proxy.proxyprovider
    id: provider-it-tools
    identifiers:
      name: homelab-it-tools
    attrs:
      mode: forward_single
      external_host: !Format ["https://tools.%s", !Env DOMAIN]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=12
  - model: authentik_core.application
    id: app-it-tools
    identifiers:
      slug: it-tools
    attrs:
      name: IT Tools
      provider: !KeyOf provider-it-tools
      policy_engine_mode: any
      meta_launch_url: !Format ["https://tools.%s/", !Env DOMAIN]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-it-tools
      group: !KeyOf group-admins
      order: 0

  # Pi-hole web UI (M8, R17): same forward-auth pattern; Pi-hole keeps its own password as a second factor of its own.
  - model: authentik_providers_proxy.proxyprovider
    id: provider-pihole
    identifiers:
      name: homelab-pihole
    attrs:
      mode: forward_single
      external_host: !Format ["https://pihole.%s", !Env DOMAIN]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=12
  - model: authentik_core.application
    id: app-pihole
    identifiers:
      slug: pihole
    attrs:
      name: Pi-hole
      provider: !KeyOf provider-pihole
      policy_engine_mode: any
      meta_launch_url: !Format ["https://pihole.%s/admin/", !Env DOMAIN]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-pihole
      group: !KeyOf group-admins
      order: 0

  # Netdata (M10, R17): forward auth, admins only.
  - model: authentik_providers_proxy.proxyprovider
    id: provider-netdata
    identifiers:
      name: homelab-netdata
    attrs:
      mode: forward_single
      external_host: !Format ["https://netdata.%s", !Env DOMAIN]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=12
  - model: authentik_core.application
    id: app-netdata
    identifiers:
      slug: netdata
    attrs:
      name: Netdata
      provider: !KeyOf provider-netdata
      policy_engine_mode: any
      meta_launch_url: !Format ["https://netdata.%s/", !Env DOMAIN]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-netdata
      group: !KeyOf group-admins
      order: 0

  # Portainer (M11, R17): forward auth, admins only (then Portainer's own login).
  - model: authentik_providers_proxy.proxyprovider
    id: provider-portainer
    identifiers:
      name: homelab-portainer
    attrs:
      mode: forward_single
      external_host: !Format ["https://portainer.%s", !Env DOMAIN]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=12
  - model: authentik_core.application
    id: app-portainer
    identifiers:
      slug: portainer
    attrs:
      name: Portainer
      provider: !KeyOf provider-portainer
      policy_engine_mode: any
      meta_launch_url: !Format ["https://portainer.%s/", !Env DOMAIN]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-portainer
      group: !KeyOf group-admins
      order: 0

  # Linkwarden (M9, R17): an OAuth2/OIDC application, not forward auth. Confidential client; the secret comes from the SSM SecureString
  # linkwarden/oidc-client-secret through the worker's environment (authentik/compose.yaml). Redirect to Linkwarden's NextAuth
  # callback only. Open to homelab-admins and homelab-users; everyone else is denied.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-linkwarden
    identifiers:
      name: homelab-linkwarden
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: linkwarden
      client_secret: !Env LINKWARDEN_OIDC_CLIENT_SECRET
      # Since Authentik 2026.x a provider allows only the grant types listed here, and a new provider starts with NONE: without this
      # every login fails with "Invalid grant_type for provider" (invalid_request; R17 deploy, 2026-11-11). Code flow and refresh only.
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://links.%s/api/v1/auth/callback/authentik", !Env DOMAIN]
          redirect_uri_type: authorization
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: minutes=10
  - model: authentik_core.application
    id: app-linkwarden
    identifiers:
      slug: linkwarden
    attrs:
      name: Linkwarden
      provider: !KeyOf provider-linkwarden
      policy_engine_mode: any
      meta_launch_url: !Format ["https://links.%s/", !Env DOMAIN]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-linkwarden
      group: !KeyOf group-admins
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-linkwarden
      group: !KeyOf group-users
      order: 1

  # --- 4. Embedded outpost ---------------------------------------------------------------------------------------------
  - model: authentik_outposts.outpost
    id: embedded-outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      providers:
        - !KeyOf provider-traefik
        - !KeyOf provider-dashboard
        - !KeyOf provider-it-tools
        - !KeyOf provider-pihole
        - !KeyOf provider-netdata
        - !KeyOf provider-portainer
      config:
        authentik_host: !Format ["https://auth.%s", !Env DOMAIN]
