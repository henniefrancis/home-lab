# Netdata agent configuration for the home lab (R17, milestone M10). Mounted read-only at /etc/netdata/netdata.conf; everything not set
# here keeps the agent's default. Runbook: docs/runbooks/m10-netdata.md.
#
# Netdata runs with the host network (host network statistics need it), so its web server would otherwise listen on every address of the
# Pi, LAN included, and the LAN could skip Authentik. It therefore binds ONLY to the gateway address of the Docker proxy network
# (172.30.0.1, the first address of PROXY_SUBNET in config/lab.env), where Traefik reaches it, and to the loopback for the container's own
# health check. "allow connections from" then refuses every peer that is not the loopback or the proxy network (Traefik), even if a LAN
# device routes to 172.30.0.1 on purpose. scripts/test-netdata-config.sh checks both against lab.env.

[web]
    bind to = 172.30.0.1:19999=dashboard 127.0.0.1:19999=dashboard
    allow connections from = localhost 172.30.0.*
    allow dashboard from = localhost 172.30.0.*
    allow management from = localhost
    allow badges from = localhost
    allow streaming from = !*
    allow netdata.conf from = localhost
    respect do not track policy = yes
    x-frame-options response header = DENY

[db]
    # SD-card wear and disk use: about 1 GiB of metrics in total (tier 0 per second, tier 1 per minute, tier 2 per hour).
    mode = dbengine
    storage tiers = 3
    dbengine tier 0 retention size = 512MiB
    dbengine tier 1 retention size = 256MiB
    dbengine tier 2 retention size = 256MiB

[registry]
    # No central registry: the dashboard does not announce this node to registry.my-netdata.io.
    enabled = no

[ml]
    # Anomaly detection is CPU-heavy on a Pi 4; the lab's alerts come from scripts/alert.sh, not from Netdata.
    enabled = no

[health]
    # Netdata's own alert notifications stay off: the lab mails through SNS (docs/runbooks/alerting.md).
    enabled = no
