---
# Traefik ingress + Roles Anywhere helper sidecar (plan 6.2, milestone M3). No Docker provider and no Docker socket proxy (SEC-H2).
# M3 runs on the Let's Encrypt STAGING CA (ACME_CA_SERVER / ACME_ENV in config/lab.env); M6 switches to production.
#
# Start (Pi):  sudo scripts/deploy.sh          (fetches secrets, then `docker compose up -d` for the root compose.yaml)
# Needs:       config/lab.env + ${APPS_ROOT}/secrets/runtime.env (DOMAIN, ROUTE53_ZONE_ID, RA_*), the networks created by
#              scripts/bootstrap.sh (proxy, authentik-auth), the Pi certificates under /etc/home-lab/pki (M2),
#              ${APPS_ROOT}/secrets/traefik/breakglass-htpasswd (SSM /home-lab/traefik/breakglass-htpasswd).
# Runbook:     docs/runbooks/m3-traefik-staging.md
#
# Routing (SEC-H2): ALL routers, services and middlewares are in dynamic/*.yml (file provider). There is no Docker provider, so
# Traefik has no path to the Docker API at all: the docker-socket-proxy (CVE-2026-78122, no fixed release) is gone and no
# container mounts docker.sock any more. The file provider is a Go template: {{ env "DOMAIN" }} in those files is filled from
# this container's DOMAIN variable, so no domain is committed. A new service = a router and a service in dynamic/routers.yml.
#
# Rules kept here: no published port besides 80 and 443 (IPv4 only); no docker.sock anywhere; the Traefik certificate key is
# mounted ONLY into ra-helper; Traefik runs as a non-root uid (TRAEFIK_UID); no static AWS keys anywhere.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # (no socket-proxy: see the header)
  traefik:
    image: traefik:v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
    container_name: traefik
    restart: unless-stopped
    # Non-root (SEC-L9): ports 80 and 443 are bound without NET_BIND_SERVICE because the unprivileged-port start of THIS
    # container's network namespace (shared with ra-helper) is lowered to 80.
    user: "${TRAEFIK_UID:?set TRAEFIK_UID in config/lab.env}:${TRAEFIK_GID:?set TRAEFIK_GID in config/lab.env}"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "80"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    # IPv4 only (SEC-L2): a bare "80:80" also makes docker-proxy listen on [::], which a global IPv6 address would expose.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    networks:
      - proxy
      - authentik-auth
    environment:
      # Filled into the {{ env "DOMAIN" }} placeholders of the dynamic files.
      DOMAIN: ${DOMAIN:?set DOMAIN (runtime.env)}
      # lego's Route 53 provider (AWS SDK) takes its credentials from the IMDS-compatible endpoint served by ra-helper
      # in this same network namespace. Route 53 is global; us-east-1 is its signing region.
      AWS_REGION: us-east-1
      AWS_HOSTED_ZONE_ID: ${ROUTE53_ZONE_ID:?set ROUTE53_ZONE_ID (runtime.env)}
      AWS_EC2_METADATA_SERVICE_ENDPOINT: http://127.0.0.1:9911
    volumes:
      # The ONE watched directory (Traefik does not watch subdirectories). scripts/deploy.sh copies traefik/dynamic/*.yml from the
      # checkout into it (root-owned, so a changed file in the checkout only takes effect on a deploy of a signed commit), and
      # scripts/breakglass.sh adds or removes bg-traefik.yml in it (traefik/breakglass/bg-traefik.yml is the template).
      - ${APPS_ROOT:?set APPS_ROOT in config/lab.env}/traefik/dynamic:/etc/traefik/dynamic:ro
      - ${APPS_ROOT:?set APPS_ROOT in config/lab.env}/traefik/letsencrypt:/letsencrypt
    secrets:
      - breakglass_users
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      # Drop request headers that merely alias another header name (X_Auth_User for X-Auth-User): required before any
      # forward-auth (M4) relies on headers set by Traefik.
      - --global.aliasHeadersStrategy=delete
      - --log.level=INFO
      - --log.format=json
      # Access log as JSON on stdout (the application log is JSON too): Docker's json-file driver (10 MB x 3, set below)
      # rotates both, so nothing grows unbounded on the SD card. Access-log lines are the ones with a DownstreamStatus field:
      #   docker logs traefik 2>&1 | jq -c 'select(.DownstreamStatus)'
      # addInternals is REQUIRED while every router is served by an internal service (dashboard api@internal, the
      # HTTP-to-HTTPS redirect): by default Traefik does not access-log requests handled by internal routers or
      # services, which left the access log empty in M3. It also records 401/403 on the dashboard.
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.addInternals=true
      # The dashboard is served only through the "dashboard" router in dynamic/routers.yml (allowlist plus Authentik forward auth);
      # the insecure API and the debug endpoints stay off.
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entryPoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.asDefault=true
      - --entrypoints.websecure.http.tls.certResolver=le
      # One wildcard certificate only. The apex is NOT ours (reserved for a future public website), so it is no SAN.
      - --entrypoints.websecure.http.tls.domains[0].main=*.${DOMAIN:?set DOMAIN (runtime.env)}
      - --entrypoints.websecure.http.middlewares=security-headers@file
      # Staging or production CA and its own storage file, both switched in config/lab.env, so a staging
      # account and certificate are never mixed with production ones.
      - --certificatesresolvers.le.acme.caServer=${ACME_CA_SERVER:?set ACME_CA_SERVER in config/lab.env}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme-${ACME_ENV:?set ACME_ENV in config/lab.env}.json
      # EC P-256 certificate key (the Traefik default is RSA 4096, slow to generate on a Pi); Let's Encrypt supports it.
      - --certificatesresolvers.le.acme.keyType=EC256
      - --certificatesresolvers.le.acme.dnsChallenge.provider=route53
      - --certificatesresolvers.le.acme.dnsChallenge.resolvers=1.1.1.1:53,8.8.8.8:53
    healthcheck:
      # TCP connect to the web entrypoint (BusyBox nc). Deliberately not `traefik healthcheck --ping`: the ping endpoint
      # needs an entrypoint of its own and, with addInternals on, every probe would be written to the access log.
      test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  ra-helper:
    # Roles Anywhere credential helper (serve). Joins Traefik's network namespace so 127.0.0.1:9911 is Traefik's own
    # loopback and is not reachable from any other container. If traefik is recreated, recreate ra-helper too
    # (`docker compose up -d` in scripts/deploy.sh always does). It exits when it cannot get credentials at start
    # (offline, expired certificate, revoked generation) and restart: unless-stopped retries.
    image: home-lab/ra-helper:1.8.6
    build:
      context: ./ra-helper
    container_name: ra-helper
    restart: unless-stopped
    network_mode: service:traefik
    depends_on:
      - traefik
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    command:
      - serve
      - --certificate
      - /run/secrets/ra_acme_crt
      - --private-key
      - /run/secrets/ra_acme_key
      - --trust-anchor-arn
      - ${RA_TRUST_ANCHOR_ARN:?set RA_TRUST_ANCHOR_ARN (runtime.env)}
      - --profile-arn
      - ${RA_ACME_PROFILE_ARN:?set RA_ACME_PROFILE_ARN (runtime.env)}
      - --role-arn
      - ${RA_ACME_ROLE_ARN:?set RA_ACME_ROLE_ARN (runtime.env)}
      - --session-duration
      - "3600"
      - --port
      - "9911"
      - --hop-limit
      - "1"
    secrets:
      - ra_acme_crt
      - ra_acme_key
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9911"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

networks:
  proxy:
    external: true
  authentik-auth:
    external: true

secrets:
  breakglass_users:
    file: ${APPS_ROOT}/secrets/traefik/breakglass-htpasswd
  # The Traefik Roles Anywhere identity (M2). The key is mounted into ra-helper only; the host key is never mounted.
  ra_acme_crt:
    file: ${PKI_DIR:-/etc/home-lab/pki}/traefik.crt
  ra_acme_key:
    file: ${PKI_DIR:-/etc/home-lab/pki}/traefik.key
