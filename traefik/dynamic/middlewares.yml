---
# Traefik dynamic configuration: shared middlewares (plan 6.3). Watched by the file provider, no restart needed.
#
# lan-allowlist: only the LAN and the tailnet may reach lab hosts. The ranges must equal LAN_CIDR and TAILNET_CIDR in
#   config/lab.env (the file provider cannot read env vars); scripts/preflight.sh checks that they match.
#   No ipStrategy is set, so the TCP peer address is used and X-Forwarded-For is never trusted.
# security-headers: applied to every response of a router on the websecure entrypoint (entrypoint-level middleware),
#   including the 401/403 answers of the allowlist and basic auth; unmatched hosts get a bare 404.
#   HSTS is short (300 s) while on the Let's Encrypt staging CA. M6 (production certificate) raises stsSeconds to 31536000 (SEC-L12):
#   a browser that has cached a long HSTS value would otherwise lock itself out if the staging certificate were ever served again.
#   No preload: this domain also hosts a separate public website on the apex.
#   CSP (SEC-L12): deliberately not set here. A global Content-Security-Policy would break Authentik and Homepage, which load inline
#   scripts and styles; each app already sends its own policy where it supports one. Revisit per router, not globally.
#
# authentik: forward auth against the EMBEDDED outpost inside authentik-server (container name on the authentik-auth network, port
#   9000, plain HTTP over the dedicated authentik-auth network that only Traefik and Authentik share). Add `authentik` AFTER
#   `lan-allowlist` to a router; the same app host also needs a "<app>-outpost" router for
#   PathPrefix(/outpost.goauthentik.io/) pointing at service `authentik` (see dynamic/routers.yml).
#   Fails closed: if Authentik is down, forwardAuth answers 500/502 and
#   the app is NOT served. trustForwardHeader is safe here: Traefik is the only edge (no proxy in front of it), and the
#   entrypoint overwrites X-Forwarded-* from untrusted peers. The header list is the one in the official Authentik Traefik
#   guide (2026.8); `authorization` is left out on purpose (no HTTP-Basic injection is configured).
#   Traefik removes these headers from the INCOMING request before it sets the authentik values, so a client cannot forge them.
http:
  middlewares:
    lan-allowlist:
      ipAllowList:
        sourceRange:
          - 10.0.0.0/24
          - 100.64.0.0/10

    security-headers:
      headers:
        stsSeconds: 300
        stsIncludeSubdomains: true
        stsPreload: false
        forceSTSHeader: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"
          Server: ""

    authentik:
      forwardAuth:
        address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        maxResponseBodySize: 4194304
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
