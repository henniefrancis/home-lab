---
# Root compose project for the Pi (plan section 5). scripts/deploy.sh runs it as
#   docker compose --env-file config/lab.env --env-file ${APPS_ROOT}/secrets/runtime.env up -d
# Each stack keeps its own directory and compose file.
name: home-lab

include:
  - path: traefik/compose.yaml
  - path: authentik/compose.yaml
  - path: tailscale/compose.yaml
  - path: homepage/compose.yaml
  - path: it-tools/compose.yaml
  - path: pihole/compose.yaml
  - path: linkwarden/compose.yaml
  - path: netdata/compose.yaml
  - path: portainer/compose.yaml
  - path: homeassistant/compose.yaml
  - path: koffan/compose.yaml
