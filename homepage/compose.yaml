---
# Homepage dashboard at https://dashboard.${DOMAIN} (plan 6.6, milestone M5), behind Authentik forward auth like the Traefik dashboard.
#
# Start (Pi):  sudo scripts/deploy.sh --only homepage      (or the whole lab: sudo scripts/deploy.sh)
# Needs:       config/lab.env + ${APPS_ROOT}/secrets/runtime.env (DOMAIN), the networks from scripts/bootstrap.sh (proxy),
#              Traefik (its routers for this host are in traefik/dynamic/routers.yml) and Authentik running (the dashboard provider and application are in
#              authentik/blueprints/homelab-apps.yaml).
# Runbook:     docs/runbooks/m5-homepage.md        Self-test: scripts/test-homepage-config.sh
#
# Identity (F02): uid:gid HOMEPAGE_UID:HOMEPAGE_GID (10003, NOT 1000, the Pi's login user, and not root, the image default).
# The image entrypoint only drops privileges when PUID is set; with `user:` and no PUID it just execs node as that uid, which is
# what we want (no chown of anything, no su-exec).
#
# Hardening: read-only root file system (the only writable paths are two tmpfs, owned by the service uid), config mounted
# read-only from the repo checkout (all nine files the app looks for are committed, so it never tries to copy its skeleton),
# logs to stdout only (LOG_TARGETS=stdout: nothing is written into the checkout), cap_drop ALL, no-new-privileges, memory
# limit, no published port. There is NO Docker integration at all (no docker.sock, no socket proxy, no status dots): the tiles are
# links. The optional add-on that used a socket proxy was removed (SEC-H2, CVE-2026-78122: a Docker API reader exposes container
# files and logs). docker.sock is never mounted here. Routing and Authentik forward auth for dashboard.<domain> are in
# traefik/dynamic/routers.yml.
#
# Homepage has no telemetry; its update check is switched off in config/settings.yaml (disableUpdateCheck, hideVersion).
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
    container_name: homepage
    restart: unless-stopped
    user: "${HOMEPAGE_UID:?set HOMEPAGE_UID in config/lab.env}:${HOMEPAGE_GID:?set HOMEPAGE_GID in config/lab.env}"
    read_only: true
    tmpfs:
      # Next.js image/response cache and scratch files. uid/gid are set so the unprivileged service can write.
      - /tmp:uid=${HOMEPAGE_UID},gid=${HOMEPAGE_GID},mode=0700
      - /app/.next/cache:uid=${HOMEPAGE_UID},gid=${HOMEPAGE_GID},mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    networks:
      - proxy
    environment:
      # Host header allow-list: any other Host (a request that bypasses Traefik, DNS rebinding) is refused by Homepage itself.
      HOMEPAGE_ALLOWED_HOSTS: dashboard.${DOMAIN:?set DOMAIN (runtime.env)}
      # Used as {{HOMEPAGE_VAR_DOMAIN}} in config/*.yaml, so no domain is committed.
      HOMEPAGE_VAR_DOMAIN: ${DOMAIN}
      LOG_TARGETS: stdout
      LOG_LEVEL: info
      TZ: ${TZ:-UTC}
      PORT: "3000"
    volumes:
      - ./config:/app/config:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    external: true
