---
# Homepage settings (plan 6.6, milestone M5). Mounted read-only; Homepage substitutes {{HOMEPAGE_VAR_*}} from the environment
# (the domain comes from compose, never from this file).
title: Home lab
description: Home lab dashboard
headerStyle: clean
theme: dark
color: slate
statusStyle: dot
target: _self
useEqualHeights: true
# No outbound "is there a newer Homepage?" check from the browser, and no version in the footer.
disableUpdateCheck: true
hideVersion: true
layout:
  Platform:
    style: row
    columns: 2
  Household:
    style: row
    columns: 1
  Tools:
    style: row
    columns: 3
