; CouchDB settings for Obsidian LiveSync (R19, M16). Mounted read-only at /opt/couchdb/etc/local.d/10-livesync.ini; CouchDB's own runtime
; writes (the hashed admin password, the cookie secret) go to docker.ini, which sorts after this file. The values are the ones the plugin's
; own server provisioning sets (utils/couchdb/provision.ts in vrtmrz/obsidian-livesync), plus require_valid_user so nothing is anonymous.
; CORS lives HERE ONLY: Traefik adds no CORS header (a doubled Access-Control-Allow-Origin breaks the plugin).
[couchdb]
single_node = true
max_document_size = 50000000

[chttpd]
require_valid_user = true
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer
