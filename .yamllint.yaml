---
extends: default

ignore: |
  .terraform/
  docs/plan/

rules:
  line-length:
    max: 160
    level: warning
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false   # GitHub Actions uses the key "on"
  comments:
    min-spaces-from-content: 1
  document-start:
    present: true
