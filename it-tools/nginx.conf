# IT Tools site (replaces the image's default.conf). Plain HTTP on 8080 inside the proxy network only: Traefik terminates TLS, applies
# the LAN/tailnet allowlist, Authentik forward auth and the shared security headers (traefik/dynamic/middlewares.yml).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Privacy (R17 plan): IT Tools runs entirely in the browser. The official build has its Plausible tracker switched off, and this
    # policy makes sure the page can never call anything but this host (fetch, XHR, beacon, WebSocket).
    add_header Content-Security-Policy "connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Dot files are never served.
    location ~ /\. {
        return 404;
    }

    # Single-page app: every tool route (/base64-string-converter, ...) is answered with index.html, as upstream's own config does.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
